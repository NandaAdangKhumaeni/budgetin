<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38"/>
      <stop offset="50%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#ff3366"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="480" height="270" fill="url(#bgCar)"/>
  <!-- Ambient circles -->
  <circle cx="390" cy="70" r="110" fill="#ec4899" opacity="0.25" filter="url(#glow)"/>
  <circle cx="90" cy="200" r="80" fill="#38bdf8" opacity="0.2" filter="url(#glow)"/>
  <path d="M0 215 L480 215" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <path d="M-20 235 L500 235" stroke="url(#neonGlow)" stroke-width="3" opacity="0.7"/>

  <!-- Modern Sport Car Silhouette -->
  <g transform="translate(100, 75)">
    <!-- Cabin Shadow & Body -->
    <path d="M45 75 Q90 32 150 32 Q210 32 235 75 Z" fill="#0f172a" opacity="0.85"/>
    <path d="M60 73 Q95 38 145 38 Q195 38 220 73 Z" fill="url(#neonGlow)" opacity="0.35"/>
    <!-- Glass pillar -->
    <path d="M142 38 L148 73" stroke="#1e293b" stroke-width="4"/>
    
    <!-- Main Chasis -->
    <path d="M15 88 Q35 85 50 68 Q55 60 75 60 L210 60 Q235 60 250 78 L265 85 Q275 92 265 105 L245 108 L225 108 Q215 88 190 88 Q165 88 155 108 L105 108 Q95 88 70 88 Q45 88 35 108 L15 108 Q5 108 5 98 Q5 88 15 88 Z" fill="url(#carBody)"/>

    <!-- Headlight & Taillight -->
    <polygon points="252,78 268,84 255,87" fill="#38bdf8" filter="url(#glow)"/>
    <polygon points="12,85 5,90 12,94" fill="#ef4444" filter="url(#glow)"/>

    <!-- Wheels -->
    <circle cx="70" cy="108" r="24" fill="#090d16"/>
    <circle cx="70" cy="108" r="16" fill="#334155" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="70" cy="108" r="6" fill="#38bdf8"/>
    
    <circle cx="190" cy="108" r="24" fill="#090d16"/>
    <circle cx="190" cy="108" r="16" fill="#334155" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="190" cy="108" r="6" fill="#ec4899"/>
  </g>
  <!-- Category Label / Icon badge -->
  <rect x="24" y="24" width="88" height="28" rx="14" fill="rgba(255,255,255,0.18)" backdrop-filter="blur(10px)"/>
  <text x="68" y="43" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">🚗 Mobil</text>
</svg>
