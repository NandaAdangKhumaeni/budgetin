<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGaming" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="padBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="neonPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="480" height="270" fill="url(#bgGaming)"/>
  <!-- Cyberpunk background particles / grid lines -->
  <line x1="0" y1="210" x2="480" y2="210" stroke="#c084fc" stroke-width="1.5" opacity="0.4"/>
  <line x1="0" y1="235" x2="480" y2="235" stroke="#e879f9" stroke-width="2" opacity="0.6"/>
  <circle cx="390" cy="80" r="85" fill="#f43f5e" opacity="0.3" filter="url(#neonPurple)"/>
  <circle cx="90" cy="190" r="75" fill="#06b6d4" opacity="0.3" filter="url(#neonPurple)"/>

  <!-- Modern Gamepad Controller Silhouette -->
  <g transform="translate(135, 60)">
    <!-- Controller Body Wings -->
    <path d="M40 70 C15 70 -5 105 10 145 C20 168 55 160 75 125 C100 135 120 135 145 125 C165 160 200 168 210 145 C225 105 205 70 180 70 C155 70 145 80 110 80 C75 80 65 70 40 70 Z" fill="url(#padBody)" stroke="#a855f7" stroke-width="3.5" filter="url(#neonPurple)"/>
    
    <!-- D-Pad (Left) -->
    <g transform="translate(48, 92)">
      <rect x="7" y="0" width="10" height="24" rx="2" fill="#cbd5e1"/>
      <rect x="0" y="7" width="24" height="10" rx="2" fill="#cbd5e1"/>
      <circle cx="12" cy="12" r="3" fill="#64748b"/>
    </g>

    <!-- Action Buttons (Right: ABXY) -->
    <g transform="translate(150, 90)">
      <circle cx="12" cy="4" r="4.5" fill="#f43f5e"/>
      <circle cx="20" cy="12" r="4.5" fill="#38bdf8"/>
      <circle cx="4" cy="12" r="4.5" fill="#eab308"/>
      <circle cx="12" cy="20" r="4.5" fill="#22c55e"/>
    </g>

    <!-- Dual Thumbsticks -->
    <circle cx="85" cy="120" r="14" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="85" cy="120" r="7" fill="#06b6d4"/>

    <circle cx="135" cy="120" r="14" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="135" cy="120" r="7" fill="#ec4899"/>
    
    <!-- LED Lightbar -->
    <path d="M95 85 L125 85" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Category Badge -->
  <rect x="24" y="24" width="102" height="28" rx="14" fill="rgba(255,255,255,0.22)" backdrop-filter="blur(10px)"/>
  <text x="75" y="43" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">🎮 Gaming</text>
</svg>
