<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="houseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="480" height="270" fill="url(#bgHome)"/>
  <circle cx="380" cy="80" r="100" fill="#34d399" opacity="0.3" filter="url(#softGlow)"/>
  <circle cx="100" cy="220" r="90" fill="#065f46" opacity="0.4"/>

  <!-- Minimalist Modern Villa House -->
  <g transform="translate(140, 50)">
    <!-- Base lawn -->
    <rect x="-30" y="150" width="260" height="12" rx="6" fill="#065f46"/>
    <!-- House Structure 1 (Main Cube) -->
    <rect x="0" y="45" width="130" height="105" rx="4" fill="#ffffff"/>
    <!-- Modern Roof Slab -->
    <rect x="-10" y="38" width="150" height="10" rx="3" fill="#1e293b"/>
    <!-- Large Panoramic Window -->
    <rect x="15" y="60" width="60" height="50" rx="3" fill="url(#houseGlow)" opacity="0.9"/>
    <line x1="45" y1="60" x2="45" y2="110" stroke="#0f172a" stroke-width="2"/>
    <line x1="15" y1="85" x2="75" y2="85" stroke="#0f172a" stroke-width="2"/>
    <!-- Door -->
    <rect x="85" y="80" width="30" height="70" rx="2" fill="#334155"/>
    <circle cx="108" cy="115" r="2.5" fill="#facc15"/>

    <!-- House Structure 2 (Side Balcony) -->
    <rect x="130" y="70" width="70" height="80" rx="4" fill="#f1f5f9"/>
    <rect x="125" y="65" width="80" height="8" rx="2" fill="#0f172a"/>
    <!-- Top Balcony Glass -->
    <rect x="135" y="85" width="60" height="25" rx="2" fill="#38bdf8" opacity="0.75"/>
    <!-- Plant pot on ground -->
    <rect x="-15" y="130" width="18" height="20" rx="2" fill="#ea580c"/>
    <circle cx="-6" cy="125" r="14" fill="#15803d"/>
  </g>
  <!-- Category Badge -->
  <rect x="24" y="24" width="94" height="28" rx="14" fill="rgba(255,255,255,0.22)" backdrop-filter="blur(10px)"/>
  <text x="71" y="43" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">🏠 Rumah</text>
</svg>
